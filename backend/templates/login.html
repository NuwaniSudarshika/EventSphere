
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EventSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #201b55, #5145e5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.2);
        }

        .brand {
            color: #5145e5;
            font-size: 27px;
            font-weight: 800;
        }

        .form-control {
            padding: 12px;
            border-radius: 9px;
        }

        .btn-login {
            background: #5145e5;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 9px;
            font-weight: 600;
        }

        .btn-login:hover {
            background: #3d32c4;
            color: white;
        }

        .form-control:focus {
            border-color: #5145e5;
            box-shadow: 0 0 0 0.2rem rgba(81,69,229,0.15);
        }

        a {
            color: #5145e5;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="text-center mb-4">
        <div class="brand">
            <i class="bi bi-globe2"></i> EventSphere
        </div>
        <h3 class="fw-bold mt-3">Welcome Back!</h3>
        <p class="text-muted">Login to your EventSphere account</p>
    </div>

    <div id="message" class="alert d-none"></div>

    <form id="loginForm">

        <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Enter your password"
                required
            >
        </div>

        <button type="submit" class="btn btn-login w-100" id="loginButton">
            <i class="bi bi-box-arrow-in-right"></i> Login
        </button>

    </form>

    <div class="text-center mt-4">
        <p class="text-muted mb-2">
            Don't have an account?
            <a href="/register">Register</a>
        </p>

        <a href="/" class="small">
            <i class="bi bi-arrow-left"></i> Back to Home
        </a>
    </div>

</div>

<script>
const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";

    message.className = "alert d-none";

    const loginData = {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
    };

    try {
        const response = await fetch("/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(loginData)
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Login failed");
        }

        localStorage.setItem("access_token", data.access_token);

        message.className = "alert alert-success";
        message.textContent = "Login successful! Redirecting...";

        setTimeout(() => {
            window.location.href = "/";
        }, 800);

    } catch (error) {
        message.className = "alert alert-danger";
        message.textContent = error.message;

    } finally {
        loginButton.disabled = false;
        loginButton.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Login';
    }
});
</script>

</body>
</html>
