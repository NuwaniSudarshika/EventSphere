
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | EventSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #201b55, #5145e5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .register-card {
            background: white;
            width: 100%;
            max-width: 460px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.2);
        }

        .brand {
            color: #5145e5;
            font-size: 27px;
            font-weight: 800;
        }

        .form-control {
            padding: 12px;
            border-radius: 9px;
        }

        .btn-register {
            background: #5145e5;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 9px;
            font-weight: 600;
        }

        .btn-register:hover {
            background: #3d32c4;
            color: white;
        }

        .form-control:focus {
            border-color: #5145e5;
            box-shadow: 0 0 0 0.2rem rgba(81,69,229,0.15);
        }

        a {
            color: #5145e5;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="text-center mb-4">
        <div class="brand">
            <i class="bi bi-globe2"></i> EventSphere
        </div>
        <h3 class="fw-bold mt-3">Create Account</h3>
        <p class="text-muted">Join EventSphere and discover exciting events</p>
    </div>

    <div id="message" class="alert d-none"></div>

    <form id="registerForm">

        <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input
                type="text"
                id="full_name"
                class="form-control"
                placeholder="Enter your full name"
                minlength="2"
                maxlength="100"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Minimum 8 characters"
                minlength="8"
                maxlength="72"
                required
            >
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Confirm Password</label>
            <input
                type="password"
                id="confirm_password"
                class="form-control"
                placeholder="Re-enter your password"
                required
            >
        </div>

        <button type="submit" class="btn btn-register w-100" id="registerButton">
            <i class="bi bi-person-plus"></i> Create Account
        </button>

    </form>

    <div class="text-center mt-4">
        <p class="text-muted mb-2">
            Already have an account?
            <a href="/login">Login</a>
        </p>

        <a href="/" class="small">
            <i class="bi bi-arrow-left"></i> Back to Home
        </a>
    </div>

</div>

<script>
const registerForm = document.getElementById("registerForm");
const message = document.getElementById("message");
const registerButton = document.getElementById("registerButton");

registerForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const fullName = document.getElementById("full_name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm_password").value;

    message.className = "alert d-none";

    if (password !== confirmPassword) {
        message.className = "alert alert-danger";
        message.textContent = "Passwords do not match.";
        return;
    }

    registerButton.disabled = true;
    registerButton.textContent = "Creating account...";

    try {
        const response = await fetch("/auth/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                full_name: fullName,
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Registration failed");
        }

        message.className = "alert alert-success";
        message.textContent = "Account created successfully! Redirecting to login...";

        registerForm.reset();

        setTimeout(() => {
            window.location.href = "/login";
        }, 1200);

    } catch (error) {
        message.className = "alert alert-danger";
        message.textContent = error.message;

    } finally {
        registerButton.disabled = false;
        registerButton.innerHTML = '<i class="bi bi-person-plus"></i> Create Account';
    }
});
</script>

</body>
</html>
