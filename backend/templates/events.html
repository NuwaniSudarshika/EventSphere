
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f7f5ff; }
        .navbar { background: #5b3cc4; }
        .event-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,.07);
            height: 100%;
        }
        .btn-purple {
            background: #5b3cc4;
            color: white;
        }
        .btn-purple:hover {
            background: #432a9b;
            color: white;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">EventSphere</a>
        <a href="/login" class="btn btn-light btn-sm">Login</a>
    </div>
</nav>

<div class="container py-5">
    <h2 class="fw-bold mb-2">Explore Events</h2>
    <p class="text-muted">Discover and book your favourite events.</p>

    <input type="text" id="searchInput"
           class="form-control mb-4"
           placeholder="Search events...">

    <div id="message"></div>
    <div class="row g-4" id="eventList"></div>
</div>

<script>
let allEvents = [];

async function loadEvents() {
    const response = await fetch("/events/");
    allEvents = await response.json();
    displayEvents(allEvents);
}

function displayEvents(events) {
    const container = document.getElementById("eventList");
    container.innerHTML = "";

    if (events.length === 0) {
        container.innerHTML = "<p>No events available.</p>";
        return;
    }

    events.forEach(event => {
        const card = document.createElement("div");
        card.className = "col-md-6 col-lg-4";

        const date = new Date(event.start_at).toLocaleString();

        card.innerHTML = `
            <div class="card event-card p-3">
                <span class="badge bg-primary mb-2">${event.category}</span>
                <h5 class="fw-bold">${escapeHTML(event.title)}</h5>
                <p>${escapeHTML(event.description || "No description available.")}</p>
                <p><strong>Date:</strong> ${date}</p>
                <p><strong>Ticket Price:</strong> ${event.ticket_price}</p>
                <p><strong>Available Tickets:</strong> ${event.total_tickets}</p>

                <label class="form-label">Quantity</label>
                <input type="number" min="1" max="${event.total_tickets}"
                       value="1" class="form-control mb-3"
                       id="quantity-${event.id}">

                <button class="btn btn-purple"
                        onclick="bookEvent(${event.id}, ${event.total_tickets})">
                    Book Now
                </button>
            </div>
        `;

        container.appendChild(card);
    });
}

function escapeHTML(value) {
    const div = document.createElement("div");
    div.textContent = value || "";
    return div.innerHTML;
}

async function bookEvent(eventId, maximum) {
    const token = localStorage.getItem("access_token");

    if (!token) {
        alert("Please login before booking an event.");
        window.location.href = "/login";
        return;
    }

    const quantity = Number(
        document.getElementById(`quantity-${eventId}`).value
    );

    if (!Number.isInteger(quantity) || quantity < 1 || quantity > maximum) {
        alert("Please enter a valid ticket quantity.");
        return;
    }

    const message = document.getElementById("message");
    message.innerHTML = "";

    try {
        const response = await fetch("/bookings/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
                event_id: eventId,
                quantity: quantity
            })
        });

        const result = await response.json();

        if (response.ok) {
            message.innerHTML = `
                <div class="alert alert-success">
                    Booking successful! Booking ID: ${result.id}
                    <br>Payment Reference: ${result.payment_reference || "Generated"}
                </div>`;
        } else {
            message.innerHTML = `
                <div class="alert alert-danger">
                    ${result.detail || "Booking failed."}
                </div>`;
        }
    } catch (error) {
        message.innerHTML =
            '<div class="alert alert-danger">Server connection failed.</div>';
    }
}

document.getElementById("searchInput").addEventListener("input", function() {
    const keyword = this.value.toLowerCase();

    const filtered = allEvents.filter(event =>
        event.title.toLowerCase().includes(keyword) ||
        (event.category || "").toLowerCase().includes(keyword)
    );

    displayEvents(filtered);
});

loadEvents();
</script>

</body>
</html>
