
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Venue Hire - EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f7f5ff; }
        .navbar { background: #5b3cc4; }
        .form-card { border: 0; border-radius: 15px; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">EventSphere</a>
        <a href="/browse-events" class="btn btn-light btn-sm">Events</a>
    </div>
</nav>

<div class="container py-5">
    <div class="card form-card shadow-sm p-4 mx-auto" style="max-width:650px">
        <h2 class="fw-bold">Private Venue Hire</h2>
        <p class="text-muted">Submit a request to hire a venue.</p>

        <form id="hireForm">
            <label class="form-label">Venue ID</label>
            <input type="number" name="venue_id" class="form-control mb-3" required>

            <label class="form-label">Start Date and Time</label>
            <input type="datetime-local" name="start_at" class="form-control mb-3" required>

            <label class="form-label">End Date and Time</label>
            <input type="datetime-local" name="end_at" class="form-control mb-3" required>

            <label class="form-label">Expected Attendees</label>
            <input type="number" name="expected_attendees" min="1" class="form-control mb-3" required>

            <label class="form-label">Purpose</label>
            <textarea name="purpose" class="form-control mb-3" required></textarea>

            <button class="btn btn-primary w-100" style="background:#5b3cc4">
                Submit Hire Request
            </button>
        </form>
        <div id="result" class="mt-3"></div>
    </div>
</div>

<script>
document.getElementById("hireForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const token = localStorage.getItem("access_token");
    if (!token) {
        location.href = "/login";
        return;
    }

    const form = new FormData(this);
    const data = Object.fromEntries(form.entries());

    data.venue_id = Number(data.venue_id);
    data.expected_attendees = Number(data.expected_attendees);

    const response = await fetch("/venues/hire-request", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    document.getElementById("result").innerHTML =
        `<div class="alert ${response.ok ? "alert-success" : "alert-danger"}">
        ${result.message || result.decision_reason || result.detail || JSON.stringify(result)}
        </div>`;
});
</script>
</body>
</html>
